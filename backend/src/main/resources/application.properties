spring.config.import=optional:file:.env[.properties]

server.port=8080
# Let Spring reconstruct the base URL from X-Forwarded-Host / X-Forwarded-Proto
# injected by ngrok (and forwarded by the Vite dev-server proxy).
# This fixes OAuth2 redirect_uri being generated as "localhost:8080" when behind a tunnel.
server.forward-headers-strategy=framework



# sendStringParametersAsUnicode=true → fixes Vietnamese / accented characters (ồ, ọ, ư ...)
# being stored/returned as ? by SQL Server JDBC driver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=taskmanagement;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
server.servlet.context-path=/taskmanager

# Force UTF-8 for all HTTP request/response bodies so Vietnamese characters
# (and any multi-byte Unicode) are serialised and deserialised correctly.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8
spring.jpa.properties.hibernate.format_sql=true

# # Temporarily disable security for testing; remove this line when JWT is implemented.
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration


# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=profile,email


# GitHub OAuth2

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}

spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.scope=read:user,user:email

# JWT (HttpOnly cookie)
jwt.secret=taskmanagement-jwt-secret-key-change-in-production-min-256-bits!!
jwt.expiration-ms=86400000
jwt.cookie-name=access_token
jwt.cookie-path=/taskmanager
jwt.cookie-secure=false

server.forward-headers-strategy=framework

app.frontend-url=http://localhost:5173/taskmanager/dashboard

# JavaMailSender configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

